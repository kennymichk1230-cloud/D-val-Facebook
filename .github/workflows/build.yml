name: Build Android APK

on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: "temurin"
      cache: gradle

  - name: Heal Gradle Wrapper
    shell: bash
    run: |
      set -e
      echo "Checking Gradle Wrapper..."

      if [ ! -f gradlew ]; then
        echo "ERROR: gradlew was not found in the repository root."
        exit 1
      fi

      chmod +x gradlew

      if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
        echo "ERROR: Gradle wrapper properties are missing."
        exit 1
      fi

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v3

  - name: Decode Keystore
    shell: bash
    env:
      SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    run: |
      set -euo pipefail
      mkdir -p app

      if [ -z "${SIGNING_KEY:-}" ]; then
        echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
        exit 1
      fi

      printf '%s' "$SIGNING_KEY" | base64 --decode > app/release.jks
      test -s app/release.jks

      echo "Keystore decoded successfully."

  - name: Verify Signing Secrets
    shell: bash
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: |
      set -euo pipefail

      test -n "${KEYSTORE_PASSWORD:-}" || {
        echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
        exit 1
      }

      test -n "${KEY_ALIAS:-}" || {
        echo "ERROR: ANDROID_KEY_ALIAS is missing."
        exit 1
      }

      test -n "${KEY_PASSWORD:-}" || {
        echo "ERROR: ANDROID_KEY_PASSWORD is missing."
        exit 1
      }

      keytool -list \
        -keystore app/release.jks \
        -storepass "$KEYSTORE_PASSWORD" \
        -alias "$KEY_ALIAS" > /dev/null

      echo "Keystore and alias verified."

  - name: Build Release APK
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: ./gradlew clean assembleRelease

  - name: Find Release APK
    id: find-apk
    shell: bash
    run: |
      set -euo pipefail

      APK_PATH="app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: Expected APK not found. Available APK files:"
        find . -type f -name "*.apk" -not -path "./.git/*" || true
        exit 1
      fi

      echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      ls -lh "$APK_PATH"

  - name: Upload Release APK
    uses: actions/upload-artifact@v4
    with:
      name: D-Val-Facebook-release-apk
      path: ${{ steps.find-apk.outputs.path }}
      if-no-files-found: error
      retention-days: 7
