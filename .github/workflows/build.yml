name: Build Android APK

on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: "temurin"
      cache: gradle

  - name: Heal Gradle Wrapper
    shell: bash
    run: |
      echo "Checking Gradle Wrapper..."

      if [ ! -f gradlew ]; then
        echo "ERROR: gradlew was not found in the repository root."
        exit 1
      fi

      chmod +x gradlew

      if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
        mkdir -p gradle/wrapper

        curl -fL \
          https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar \
          -o gradle/wrapper/gradle-wrapper.jar
      fi

      if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
        echo "ERROR: gradle-wrapper.properties is missing."
        exit 1
      fi

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v3

  - name: Decode Keystore
    shell: bash
    env:
      SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    run: |
      set -euo pipefail

      mkdir -p app

      if [ -z "${SIGNING_KEY:-}" ]; then
        echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
        exit 1
      fi

      printf '%s' "$SIGNING_KEY" | base64 --decode > app/release.jks

      if [ ! -s app/release.jks ]; then
        echo "ERROR: Keystore decoding failed or produced an empty file."
        exit 1
      fi

      echo "Keystore decoded successfully."

  - name: Verify Android Signing Configuration
    shell: bash
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: |
      set -euo pipefail

      if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
        echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
        exit 1
      fi

      if [ -z "${KEY_ALIAS:-}" ]; then
        echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
        exit 1
      fi

      if [ -z "${KEY_PASSWORD:-}" ]; then
        echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
        exit 1
      fi

      keytool -list \
        -keystore app/release.jks \
        -storepass "$KEYSTORE_PASSWORD" \
        -alias "$KEY_ALIAS" > /dev/null

      echo "Keystore and alias verified successfully."

  - name: Build Release APK
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    run: |
      ./gradlew clean assembleRelease

  - name: Verify Release APK
    shell: bash
    run: |
      set -euo pipefail

      APK_PATH="app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: Release APK was not found at $APK_PATH"
        echo "Checking available APK files..."
        find app/build/outputs -type f -name "*.apk" 2>/dev/null || true
        exit 1
      fi

      echo "Release APK created successfully."
      ls -lh "$APK_PATH"

  - name: Upload Release APK
    uses: actions/upload-artifact@v4
    with:
      name: D-Val-Facebook-release-apk
      path: app/build/outputs/apk/release/app-release.apk
      if-no-files-found: error
      retention-days: 7
