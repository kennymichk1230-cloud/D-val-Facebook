name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Ensure Valid Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          chmod +x gradlew 2>/dev/null || true

          # Verify that gradle-wrapper.jar is a valid uncorrupted zip/jar
          if ! unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper jar is missing or corrupted. Generating official wrapper..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
          fi

      - name: Decode Keystore
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p app

          if [ -n "$SIGNING_KEY" ]; then
            echo "Decoding release keystore from SIGNING_KEY secret..."
            echo "$SIGNING_KEY" | tr -d '\r\n' | base64 -d > app/release.jks

            # If the keystore file is empty or invalid, clean it up to allow debug fallback
            if [ ! -s app/release.jks ]; then
              echo "Decoded keystore is empty. Removing to fall back to debug signing."
              rm -f app/release.jks
            fi
          else
            echo "SIGNING_KEY secret not set; build will use fallback signing configuration."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ] && unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            ./gradlew clean assembleRelease --stacktrace
          else
            gradle clean assembleRelease --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
